name: CI
permissions:
  contents: read

on:
  push:
    branches: [main] # Only run on direct pushes to main
    tags-ignore: ["v*"] # Don't run CI on release tags (release workflow handles that)
  pull_request:
    branches: [main] # Run on all PRs targeting main

# Cancel in-progress runs when a new run starts for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast check - runs first, fails fast on formatting issues
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      # Without this the flake's own extra-substituters are ignored ("untrusted
      # flake configuration"), so nothing is pulled from the zmre cache and every
      # dependency is built from source.
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      # `nix build .#fmt` (craneLib.cargoFmt), not `nix develop --command cargo
      # fmt`. The dev shell pulls in the whole build closure — ffmpeg, webkitgtk,
      # GTK — to run a check that only needs rustfmt, which meant a formatting
      # check could fail because ffmpeg.org refused a download.
      - name: Check formatting
        run: nix build -L .#fmt

  # Build frontend components - needed by lint and test jobs
  build-components:
    name: Build Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build components
        run: |
          set -euo pipefail
          nix build -L .#mbr-components
          echo "=== Nix build output ==="
          ls -la result/
          mkdir -p templates/components-js
          cp -v result/* templates/components-js/
          echo "=== Copied components ==="
          ls -la templates/components-js/
          test -f templates/components-js/mbr-components.min.js || { echo "FATAL: mbr-components.min.js not created!"; exit 1; }
          test -f templates/components-js/mbr-editor.min.js || { echo "FATAL: mbr-editor.min.js not created!"; exit 1; }
          test -f templates/components-js/mbr-graph.min.js || { echo "FATAL: mbr-graph.min.js not created!"; exit 1; }
          test -f templates/components-js/mbr-genealogy.min.js || { echo "FATAL: mbr-genealogy.min.js not created!"; exit 1; }

      - name: Upload components
        uses: actions/upload-artifact@v7
        with:
          name: components
          path: templates/components-js/
          retention-days: 1
          if-no-files-found: error

  # Clippy lint
  #
  # NOTE: no `needs: build-components` and no artifact download here, unlike the
  # minimal-features and windows jobs below. That is deliberate, not an omission.
  #
  # `nix build .#clippy` supplies the components itself: the flake's `clippy`
  # attr has a preBuild that copies `${packages.mbr-components}` into
  # templates/components-js (flake.nix ~583-586). Downloading the artifact would
  # at best be redundant -- the preBuild overwrites it either way.
  #
  # More to the point, the artifact is *invisible* to Nix. templates/components-js
  # is gitignored (.gitignore:15) and `.#` resolves as a git-tree flake ref, so
  # those files are stripped from the flake source before the `src` filter in
  # flake.nix ever sees them (the filter's `.*templates.*` rule would otherwise
  # match). Verified empirically: `.#clippy.drvPath` is byte-identical with the
  # directory populated, with an extra file added, and with the directory deleted
  # outright. So gating on build-components only serialized ~2-4 min of npm build
  # onto the critical path in exchange for nothing.
  #
  # HAZARD: this holds only for the bare `.#` ref. `path:.#` copies untracked
  # files into the store and DOES hash differently (confirmed: different drvPath).
  # If anyone un-gitignores templates/components-js, or switches these
  # invocations to `path:.`, this decoupling silently becomes wrong and these
  # jobs need their `needs` + download restored.
  lint:
    name: Clippy Lint (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Clippy lint
        run: nix build -L .#clippy

  # Tests
  #
  # No `needs: build-components` / artifact download -- `nix build .#tests` is
  # self-supplying via the `tests` attr's preBuild (flake.nix ~595-598). See the
  # long note on the `lint` job above for the full reasoning and the `path:.#`
  # hazard.
  test:
    name: Test (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Run tests
        run: nix build -L .#tests

  # Full build - runs in parallel with lint/test
  #
  # No `needs: build-components` / artifact download -- `nix build .#mbr` reaches
  # `mbr-cli`, whose preBuild copies the components in (flake.nix ~474-477). See
  # the long note on the `lint` job above for the full reasoning and the
  # `path:.#` hazard.
  build:
    name: Build (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build
        run: nix build -L .#mbr

      - name: Check docs for broken links
        run: ./result/bin/mbr -b docs --fail-on-broken-links

  # Build and test the exact feature set Windows ships, but on Linux.
  #
  # Cargo feature combinations are only as tested as the combinations you build.
  # `--no-default-features --features gui` turns off `media-metadata`, which
  # cfg-gates whole CLI arguments — and a stale `conflicts_with_all` reference to
  # a gated argument makes clap panic at startup on *every* invocation, not just
  # in tests. That is a feature-resolution bug, not a platform bug, so catching it
  # here gives fast feedback instead of waiting on a Windows runner.
  #
  # This used to run `nix develop --command cargo clippy/test ...`. The dev shell
  # was cached, but the cargo build *inside* it was not — no cache-workspaces, no
  # rust-cache, no cachix participation — and this feature set shares no compiled
  # artifacts with the crane-built jobs, so it recompiled the entire dependency
  # tree on every PR (~10-20 min). `.#clippy-minimal` / `.#tests-minimal` are
  # crane derivations over their own `cargoArtifactsMinimal` (flake.nix), so the
  # dep tree is content-addressed, pushed to cachix, and reused across runs and
  # between these two steps. The lint and the tests still run at exactly the same
  # feature set, so the bug class above is still caught.
  #
  # `needs: build-components` and the artifact download are gone for the same
  # reason as the lint/test/build jobs above — these are now `nix build .#` and
  # self-supply components via preBuild. See the note on `lint`.
  minimal-features:
    name: Minimal Feature Set (no media-metadata)
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Clippy lint
        run: nix build -L .#clippy-minimal

      - name: Run tests
        run: nix build -L .#tests-minimal

  # Windows build + lint + test.
  #
  # Nix does not run on Windows, so this job is the one place in CI that uses the
  # rustup-provided toolchain instead of `nix build`. `rust-toolchain.toml` still
  # pins the version, so the compiler matches the Nix jobs.
  #
  # Windows builds without `media-metadata`. The blocker is ffmpeg-sys-next, which
  # needs prebuilt dev libraries (headers + .lib import libs) via FFMPEG_DIR or
  # vcpkg — note that actions like setup-ffmpeg install ffmpeg.exe only, not the
  # dev libraries. pdfium-render would in fact build here (we use pre-generated
  # bindings and libloading, so pdfium.dll is a runtime-only dependency), but it
  # is gated behind the same feature. Splitting `media-metadata` into `pdf-cover`
  # and `video-metadata` would recover PDF cover extraction on Windows.
  #
  # So Windows gets server, GUI (WebView2), static site generation, and search;
  # it does not get video metadata/transcoding or PDF cover images.
  windows:
    name: Windows (${{ matrix.arch }})
    needs: [format-check, build-components]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Components are built once on Linux via Nix and reused here — Windows has
      # no Nix, and these files are `include_bytes!`'d so they must exist before
      # cargo runs.
      - name: Download components
        uses: actions/download-artifact@v8
        with:
          name: components
          path: templates/components-js/

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Reads channel and components from rust-toolchain.toml.
          cache-workspaces: "."

      - name: Clippy lint
        run: cargo clippy --all-targets --no-default-features --features gui -- -D warnings

      - name: Run tests
        run: cargo test --no-default-features --features gui

      - name: Build release binary
        run: cargo build --release --no-default-features --features gui

      - name: Smoke test the binary
        run: |
          ./target/release/mbr.exe --version
          ./target/release/mbr.exe -b docs --output build-test --fail-on-broken-links

      # Downloadable from the workflow run summary, so a Windows machine can try
      # a build without waiting for a release.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: mbr-windows-${{ matrix.arch }}
          path: target/release/mbr.exe
          if-no-files-found: error
          retention-days: 14

  # Swift checks - only run on macOS
  swift-check:
    name: Swift Checks
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Swift format check
        run: nix build -L .#swiftfmt

      - name: SwiftLint check
        run: nix build -L .#swiftlint-check

  # Guard against Dependabot (or manual) bumps of components/ dependencies that
  # forget to regenerate components/package-lock.json and the flake's npmDepsHash.
  # The Nix component build (`nix build .#mbr-components`) reads package-lock.json
  # and pins its contents via npmDepsHash, so a bump of components/package.json (or
  # the bun lockfile) that leaves those untouched will break the build on merge.
  # This job regenerates both from package.json and FAILS if they drift.
  components-lock-sync:
    name: Components Lockfile & npmDepsHash Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect components/ changes
        id: changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          # Only relevant on pull_request events; skip on pushes to main.
          if [ -z "$base" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^components/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.changes.outputs.changed == 'true'
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Verify package-lock.json and npmDepsHash are in sync
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Regenerate components/package-lock.json and flake.nix's npmDepsHash
          # from components/package.json. `npm` comes from the pinned nodejs;
          # sync-npm-deps.sh internally uses `nix run nixpkgs#prefetch-npm-deps`.
          nix shell nixpkgs#nodejs --command scripts/sync-npm-deps.sh --force
          if ! git diff --quiet -- components/package-lock.json flake.nix; then
            echo "::error::components/package-lock.json and/or flake.nix npmDepsHash are out of sync with components/package.json."
            echo "Run 'scripts/sync-npm-deps.sh --force' locally, then commit the updated components/package-lock.json and flake.nix."
            git --no-pager diff -- components/package-lock.json flake.nix
            exit 1
          fi
          echo "Components package-lock.json and npmDepsHash are in sync."

  # Frontend component tests (TypeScript)
  test-components:
    name: Test Frontend Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd components && bun install

      - name: Run component tests
        run: cd components && bun run test

      - name: Build components (includes type check via tsc)
        run: cd components && bun run build
