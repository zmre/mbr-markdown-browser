name: Release
permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.4.0) - must match Cargo.toml"
        required: true
        type: string

# Ensure only one release workflow runs at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build frontend components - needed by test job
  build-components:
    name: Build Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build components
        run: |
          set -euo pipefail
          nix build .#mbr-components
          echo "=== Nix build output ==="
          ls -la result/
          mkdir -p templates/components-js
          cp -v result/* templates/components-js/
          echo "=== Copied components ==="
          ls -la templates/components-js/
          # Fail fast if the required files don't exist
          test -f templates/components-js/mbr-components.min.js || { echo "FATAL: mbr-components.min.js not created!"; exit 1; }
          test -f templates/components-js/mbr-editor.min.js || { echo "FATAL: mbr-editor.min.js not created!"; exit 1; }
          test -f templates/components-js/mbr-graph.min.js || { echo "FATAL: mbr-graph.min.js not created!"; exit 1; }
          test -f templates/components-js/mbr-genealogy.min.js || { echo "FATAL: mbr-genealogy.min.js not created!"; exit 1; }

      - name: Upload components
        uses: actions/upload-artifact@v7
        with:
          name: components
          path: templates/components-js/
          retention-days: 1
          if-no-files-found: error

  # Run tests first - must pass before building release artifacts
  test:
    name: Test (${{ matrix.os }})
    needs: build-components
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download components
        uses: actions/download-artifact@v8
        with:
          name: components
          path: templates/components-js/

      - name: Verify components downloaded
        run: |
          echo "Downloaded components:"
          ls -la templates/components-js/
          if [ ! -f templates/components-js/mbr-components.min.js ]; then
            echo "ERROR: mbr-components.min.js not found!"
            exit 1
          fi
          if [ ! -f templates/components-js/mbr-editor.min.js ]; then
            echo "ERROR: mbr-editor.min.js not found!"
            exit 1
          fi
          if [ ! -f templates/components-js/mbr-graph.min.js ]; then
            echo "ERROR: mbr-graph.min.js not found!"
            exit 1
          fi
          if [ ! -f templates/components-js/mbr-genealogy.min.js ]; then
            echo "ERROR: mbr-genealogy.min.js not found!"
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Run tests
        run: nix develop --command cargo test --all-features

  # Validate version consistency between tag and Cargo.toml
  validate-version:
    name: Validate Version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract and validate version
        id: version
        run: |
          # Determine version from tag or input
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

          # Get version from Cargo.toml
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"

          # Validate match
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "::error::Version mismatch! Tag/input: $VERSION, Cargo.toml: $CARGO_VERSION"
            echo "Run: ./scripts/bump-version.sh $VERSION"
            exit 1
          fi

          echo "Version validated: $VERSION"

  # Build release artifacts for all platforms
  build:
    name: Build (${{ matrix.arch }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: macos-arm64
          # Intel macOS, needed to build the x86_64 half of the universal app.
          # `macos-13` was retired in Dec 2025; `macos-26-intel` is the current
          # standard-tier (free for public repos) Intel image. Intel runners are
          # scheduled to disappear after the macOS 15 image retires in Aug 2027.
          - os: macos-26-intel
            arch: macos-x86_64
          - os: ubuntu-latest
            arch: linux-x86_64

    env:
      VERSION: ${{ needs.validate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build release artifacts
        run: |
          nix build .#release
          mkdir -p staging
          cp -r result/* staging/

      - name: List artifacts
        run: ls -la staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error

  # Windows release build. Nix is unavailable on Windows, so this uses the
  # rustup toolchain pinned by rust-toolchain.toml and packages a plain .zip.
  # `media-metadata` is off — see the note on the Windows job in ci.yml.
  build-windows:
    name: Build (windows-${{ matrix.arch }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: aarch64

    env:
      VERSION: ${{ needs.validate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download components
        uses: actions/download-artifact@v8
        with:
          name: components
          path: templates/components-js/

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: "."

      - name: Build release binary
        run: cargo build --release --no-default-features --features gui

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/release/mbr.exe staging/
          Copy-Item README.md staging/
          Copy-Item LICENSE staging/LICENSE.txt
          Compress-Archive -Path staging/* -DestinationPath mbr-windows-${{ matrix.arch }}.zip -Force
          Get-ChildItem mbr-windows-${{ matrix.arch }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: mbr-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  # Fuse the two macOS builds into a universal MBR.app and wrap it in a DMG.
  # Nix only builds for the host platform, so the arm64 and x86_64 bundles come
  # from separate runners in the `build` matrix and are joined here with lipo.
  package-dmg:
    name: Package Universal DMG
    needs: [validate-version, build]
    runs-on: macos-latest

    env:
      VERSION: ${{ needs.validate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-macos-*

      - name: Unpack app bundles
        run: |
          set -euo pipefail
          mkdir -p apps/arm64 apps/x86_64
          tar xzf artifacts/release-macos-arm64/mbr-macos-arm64.tar.gz -C apps/arm64
          tar xzf artifacts/release-macos-x86_64/mbr-macos-x86_64.tar.gz -C apps/x86_64
          ls -la apps/arm64 apps/x86_64

      - name: Build universal DMG
        run: |
          scripts/make-universal-dmg.sh \
            apps/arm64/MBR.app \
            apps/x86_64/MBR.app \
            dist/mbr-macos-universal.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-universal-dmg
          path: dist/mbr-macos-universal.dmg
          if-no-files-found: error

  # Create GitHub Release with all artifacts
  release:
    name: Create Release
    needs: [validate-version, build, build-windows, package-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*

      - name: Prepare release files
        run: |
          mkdir -p release

          # Copy all artifacts
          find artifacts \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) \
            -exec cp {} release/ \;

          # Generate combined checksums. nullglob keeps an absent artifact type
          # from leaving an unexpanded glob on the sha256sum command line.
          cd release
          shopt -s nullglob
          sha256sum -- *.tar.gz *.zip *.dmg > SHA256SUMS

          echo "Release files:"
          ls -la

      - name: Generate release notes
        run: |
          cat << 'EOF' > release_notes.md
          ## mbr v${{ needs.validate-version.outputs.version }}

          ### Downloads

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | macOS (app) | Universal (Intel + Apple Silicon) | `mbr-macos-universal.dmg` |
          | macOS (app) | ARM64 (Apple Silicon) | `mbr-macos-arm64.tar.gz` |
          | macOS (app) | x86_64 (Intel) | `mbr-macos-x86_64.tar.gz` |
          | macOS (CLI) | ARM64 / x86_64 | `mbr-cli-macos-*.tar.gz` |
          | Linux | x86_64 | `mbr-linux-x86_64.tar.gz` |
          | Windows | x86_64 | `mbr-windows-x86_64.zip` |
          | Windows | ARM64 | `mbr-windows-aarch64.zip` |

          ### Installation

          **macOS (easiest):** download `mbr-macos-universal.dmg`, open it, and drag
          `MBR.app` to the Applications folder.

          These builds are ad-hoc signed but **not notarized**, so the first launch is
          blocked by Gatekeeper. Right-click `MBR.app` → **Open** → **Open**, or run:

          ```bash
          xattr -dr com.apple.quarantine /Applications/MBR.app
          ```

          **macOS (tarball):**
          ```bash
          tar xzf mbr-macos-arm64.tar.gz
          cp -r MBR.app /Applications/
          ```

          **Linux:**
          ```bash
          tar xzf mbr-linux-x86_64.tar.gz
          sudo mv mbr /usr/local/bin/
          ```

          **Windows:**
          Unzip `mbr-windows-x86_64.zip` and run `mbr.exe`. Requires the Microsoft
          Edge WebView2 runtime for GUI mode (preinstalled on Windows 11 and current
          Windows 10). Windows builds do not include video metadata/transcoding or
          PDF cover extraction.

          ### Verification

          Verify downloads using the SHA256SUMS file:
          ```bash
          sha256sum -c SHA256SUMS
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.validate-version.outputs.version }}
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.validate-version.outputs.version) }}
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(needs.validate-version.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io after the GitHub Release succeeds.
  # --allow-dirty: templates/components-js/ is gitignored but must be present
  #   in the tree so include_bytes! picks up the built component.
  # --no-verify: the `test` and `build` jobs above have already compiled the
  #   crate with all features; skipping the verify recompile avoids needing
  #   ffmpeg/pdfium system libs here.
  publish-crate:
    name: Publish to crates.io
    needs: [validate-version, test, release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download components
        uses: actions/download-artifact@v8
        with:
          name: components
          path: templates/components-js/

      - name: Publish to crates.io
        run: cargo publish --allow-dirty --no-verify --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
