name: Release
permissions:
  contents: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.4.0) - must match Cargo.toml"
        required: true
        type: string

# Ensure only one release workflow runs at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build frontend components - needed by test job
  build-components:
    name: Build Components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      # Without this the flake's own extra-substituters are ignored ("untrusted
      # flake configuration"), so nothing is pulled from the zmre cache and every
      # dependency is built from source.
      #
      # `extraPullNames: nix-community` is not optional decoration. That is where
      # the rust-overlay toolchains live; omit it and every Nix job in this
      # workflow re-fetches and rebuilds the pinned Rust toolchain that ci.yml
      # gets substituted for free.
      #
      # Keep this block byte-identical to the one in ci.yml. Release runs on a
      # tag that CI already built and pushed, so the derivations are the same
      # ones sitting in the cache — any drift here (different installer, missing
      # substituter) silently turns a cache hit into a from-source rebuild of
      # ffmpeg, pdfium, and the entire crate dependency graph.
      #
      # There is deliberately no magic-nix-cache step: the action is deprecated,
      # ci.yml does not use it, and its GitHub-Actions-cache store only ever
      # helped within a single workflow — Cachix is what carries store paths
      # between CI and Release.
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build components
        run: |
          set -euo pipefail
          nix build .#mbr-components
          echo "=== Nix build output ==="
          ls -la result/
          mkdir -p templates/components-js
          cp -v result/* templates/components-js/
          echo "=== Copied components ==="
          ls -la templates/components-js/
          # Fail fast if the required files don't exist
          test -f templates/components-js/mbr-components.min.js || { echo "FATAL: mbr-components.min.js not created!"; exit 1; }
          test -f templates/components-js/mbr-editor.min.js || { echo "FATAL: mbr-editor.min.js not created!"; exit 1; }
          test -f templates/components-js/mbr-graph.min.js || { echo "FATAL: mbr-graph.min.js not created!"; exit 1; }
          test -f templates/components-js/mbr-genealogy.min.js || { echo "FATAL: mbr-genealogy.min.js not created!"; exit 1; }

      - name: Upload components
        uses: actions/upload-artifact@v7
        with:
          name: components
          path: templates/components-js/
          retention-days: 1
          if-no-files-found: error

  # Run tests first - must pass before building release artifacts
  #
  # NOTE: no `needs: build-components` and no artifact download here, unlike the
  # build-windows and publish-crate jobs below. That is deliberate, not an
  # omission.
  #
  # `nix build -L .#tests` supplies the components itself: the flake's `tests`
  # attr has a preBuild that copies `${packages.mbr-components}` into
  # templates/components-js (flake.nix ~595-598). The downloaded artifact was
  # overwritten by that preBuild before a single test ran.
  #
  # More to the point, the artifact is *invisible* to Nix. templates/components-js
  # is gitignored (.gitignore:15) and `.#` resolves as a git-tree flake ref, so
  # those files are stripped from the flake source before the `src` filter in
  # flake.nix ever sees them. Verified empirically: `.#tests.drvPath` is
  # byte-identical with the directory populated, with an extra file added, and
  # with the directory deleted outright. Gating on build-components only
  # serialized ~2-4 min of npm build onto the release critical path.
  #
  # HAZARD: this holds only for the bare `.#` ref. `path:.#` copies untracked
  # files into the store and DOES hash differently (confirmed: different
  # drvPath). If anyone un-gitignores templates/components-js, or switches this
  # invocation to `path:.`, this decoupling silently becomes wrong.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      # Same setup as build-components above — see the comment there for why the
      # cachix step and `extraPullNames` are load-bearing rather than cosmetic.
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      # `nix build -L .#tests` (craneLib.cargoTest) — the same command ci.yml's
      # Test job runs, so "the tested feature set" has exactly one definition:
      # the flake's `cliFeatures`. That is gui + media-metadata + ffmpeg-static,
      # plus `ffi` on Darwin only, which is precisely what the `build` job below
      # compiles the shipped artifacts from.
      #
      # Do NOT use `--all-features` here. `ffi` (UniFFI bindings for the macOS
      # QuickLook extension) is macOS-only *by design*: `uniffi` is declared
      # solely under [target.'cfg(target_os = "macos")'] in Cargo.toml, as both a
      # dependency and a build-dependency. On Linux `--all-features` therefore
      # enables `ffi` while the crate is absent, and three things fail to
      # compile: build.rs, the `uniffi-bindgen` bin (required-features = ["ffi"]),
      # and src/lib.rs's quicklook module. On macOS `--all-features` happens to
      # equal `cliFeatures` today, but only by coincidence — it tracks the
      # feature *table* rather than what we ship, so any feature added to
      # Cargo.toml silently changes what the release gate tests.
      - name: Run tests
        run: nix build -L .#tests

  # Validate version consistency between tag and Cargo.toml
  validate-version:
    name: Validate Version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract and validate version
        id: version
        run: |
          # Determine version from tag or input
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

          # Get version from Cargo.toml
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"

          # Validate match
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "::error::Version mismatch! Tag/input: $VERSION, Cargo.toml: $CARGO_VERSION"
            echo "Run: ./scripts/bump-version.sh $VERSION"
            exit 1
          fi

          echo "Version validated: $VERSION"

  # Build release artifacts for all platforms
  build:
    name: Build (${{ matrix.arch }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is Apple Silicon only. An Intel (x86_64-darwin) leg used to
          # live here, but nothing in ci.yml ever built Intel Darwin, so it
          # substituted nothing it had not pushed itself and every release paid
          # a 15-40 minute from-source build of ffmpeg-static and the whole
          # dependency graph on a slow Intel runner.
          #
          # The flake still builds on x86_64-darwin for anyone compiling from
          # source, but note that nixpkgs 26.05 (what flake.nix pins) is the
          # LAST nixpkgs release to support x86_64-darwin at all — bumping past
          # it removes that ability, at which point the Intel branches in
          # flake.nix (`nixpkgsForSystem`, `archString`, `swiftTarget`) can go.
          - os: macos-latest
            arch: macos-arm64
          - os: ubuntu-latest
            arch: linux-x86_64
          # `arch` here only names the uploaded artifact. The tarball *inside* it
          # is named by the flake's `archString`, which maps aarch64-linux to
          # "linux-arm64" — so these two must agree or the release notes point at
          # a filename that does not exist.
          - os: ubuntu-24.04-arm
            arch: linux-arm64

    env:
      VERSION: ${{ needs.validate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      # Same setup as build-components above — see the comment there for why the
      # cachix step and `extraPullNames` are load-bearing rather than cosmetic.
      # Every arch in this matrix is also built by ci.yml, so these builds are
      # cache hits rather than from-source rebuilds. Keep it that way: adding a
      # target here that ci.yml does not build reintroduces the cold-cache stall
      # that got the Intel leg deleted.
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build release artifacts
        run: |
          nix build .#release
          mkdir -p staging
          cp -r result/* staging/

      - name: List artifacts
        run: ls -la staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error

  # Windows release build. Nix is unavailable on Windows, so this uses the
  # rustup toolchain pinned by rust-toolchain.toml and packages a plain .zip.
  # `media-metadata` is off — see the note on the Windows job in ci.yml.
  # `build-components` is listed explicitly even though this job does not use its
  # output directly in a `nix build`: cargo here is rustup's, and the components
  # are `include_bytes!`'d, so the artifact must exist before cargo runs. This
  # job used to get that ordering transitively (build-windows -> validate-version
  # -> test -> build-components); the `test` job no longer depends on
  # build-components, so the edge has to be declared here or the download races
  # the upload.
  build-windows:
    name: Build (windows-${{ matrix.arch }})
    needs: [validate-version, build-components]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: aarch64

    env:
      VERSION: ${{ needs.validate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download components
        uses: actions/download-artifact@v8
        with:
          name: components
          path: templates/components-js/

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: "."

      - name: Build release binary
        run: cargo build --release --no-default-features --features gui

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item target/release/mbr.exe staging/
          Copy-Item README.md staging/
          Copy-Item LICENSE staging/LICENSE.txt
          Compress-Archive -Path staging/* -DestinationPath mbr-windows-${{ matrix.arch }}.zip -Force
          Get-ChildItem mbr-windows-${{ matrix.arch }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.arch }}
          path: mbr-windows-${{ matrix.arch }}.zip
          if-no-files-found: error

  # Wrap the arm64 macOS app bundle in a drag-to-/Applications DMG. This ran on
  # a separate job when it had to lipo two architectures together; it stays
  # separate because the DMG must be built on macOS while the `build` matrix
  # artifact it consumes is just a tarball.
  package-dmg:
    name: Package macOS DMG
    needs: [validate-version, build]
    runs-on: macos-latest

    env:
      VERSION: ${{ needs.validate-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `name:` (a single artifact) unpacks straight into `path`, whereas the
      # `pattern:` form this used to use nests each artifact in a subdirectory
      # named after it. Hence `artifacts/mbr-...` here and not
      # `artifacts/release-macos-arm64/mbr-...`.
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          name: release-macos-arm64

      - name: Unpack app bundle
        run: |
          set -euo pipefail
          ls -la artifacts
          # Fail with a readable message rather than a bare tar error if the
          # artifact layout ever shifts under us.
          test -f artifacts/mbr-macos-arm64.tar.gz || {
            echo "::error::mbr-macos-arm64.tar.gz missing from the release-macos-arm64 artifact"
            exit 1
          }
          mkdir -p apps/arm64
          tar xzf artifacts/mbr-macos-arm64.tar.gz -C apps/arm64
          test -d apps/arm64/MBR.app || {
            echo "::error::MBR.app missing from mbr-macos-arm64.tar.gz"
            exit 1
          }
          ls -la apps/arm64

      - name: Build DMG
        run: |
          scripts/make-macos-dmg.sh \
            apps/arm64/MBR.app \
            dist/mbr-macos-arm64.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64-dmg
          path: dist/mbr-macos-arm64.dmg
          if-no-files-found: error

  # Create GitHub Release with all artifacts
  release:
    name: Create Release
    needs: [validate-version, build, build-windows, package-dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 for the tags — the "Generate release notes" step below
      # picks the changelog base itself and needs the full tag list. The default
      # shallow checkout fetches only the tagged commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*

      - name: Prepare release files
        run: |
          mkdir -p release

          # Copy all artifacts
          find artifacts \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) \
            -exec cp {} release/ \;

          # Generate combined checksums. nullglob keeps an absent artifact type
          # from leaving an unexpanded glob on the sha256sum command line.
          cd release
          shopt -s nullglob
          sha256sum -- *.tar.gz *.zip *.dmg > SHA256SUMS

          echo "Release files:"
          ls -la

      # Pin the changelog base explicitly instead of letting GitHub infer it.
      #
      # `generate_release_notes: true` on softprops/action-gh-release delegates
      # the choice of "previous tag" to GitHub, which picked a base far back in
      # history and produced a What's Changed list spanning many releases —
      # hand-edited after every tag. softprops exposes no `previous_tag_name`
      # input, so we call the generate-notes API ourselves and append the result
      # to the body below (the same position GitHub would have put it).
      #
      # Base = highest *stable* tag below the current one. A '-' in the version
      # marks a prerelease, matching the `prerelease:` rule on the release step,
      # so rc tags are never the base: v0.5.1's notes cover everything since
      # v0.5.0 rather than just the delta from v0.5.1-rc1.
      #
      # target_commitish is required because on workflow_dispatch the tag does
      # not exist yet — the release action creates it.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate-version.outputs.version }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.validate-version.outputs.version) }}
        run: |
          set -euo pipefail

          # Splice the current version into the stable-tag list, sort, and take
          # the line before it. Handles the first-ever release (nothing before
          # it, so PREV lands on CURRENT itself) via the guard below.
          CURRENT="v${VERSION}"
          # The `|| true` matters: with `set -euo pipefail`, a repo whose tags are
          # all prereleases makes this grep exit 1 and takes the whole step with
          # it. The outer grep needs no guard — CURRENT is always in its input.
          PREV=$(
            { git tag --list 'v*' | { grep -v -- '-' || true; }; echo "$CURRENT"; } \
              | sort -V -u \
              | grep -B1 -Fx -- "$CURRENT" \
              | head -n1
          )
          if [ "$PREV" = "$CURRENT" ]; then
            echo "No earlier stable tag; generating notes over full history."
            PREV=""
          else
            echo "Changelog base: $PREV -> $TAG"
          fi

          if [ -n "$PREV" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${GITHUB_SHA}" \
              -f previous_tag_name="$PREV" \
              --jq .body > generated_notes.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq .body > generated_notes.md
          fi

          cat << 'EOF' > release_notes.md
          ## mbr v${{ needs.validate-version.outputs.version }}

          ### Downloads

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | macOS (app) | ARM64 (Apple Silicon) | `mbr-macos-arm64.dmg` |
          | macOS (app) | ARM64 (Apple Silicon) | `mbr-macos-arm64.tar.gz` |
          | macOS (CLI) | ARM64 (Apple Silicon) | `mbr-cli-macos-arm64.tar.gz` |
          | Linux | x86_64 | `mbr-linux-x86_64.tar.gz` |
          | Linux | ARM64 (aarch64) | `mbr-linux-arm64.tar.gz` |
          | Windows | x86_64 | `mbr-windows-x86_64.zip` |
          | Windows | ARM64 | `mbr-windows-aarch64.zip` |

          > **Intel Macs are no longer supported.** Starting with this release there
          > are no x86_64 macOS builds — the DMG and tarballs are Apple Silicon only.
          > Intel users can still build from source (`cargo install --git ...`, or
          > `nix build .#mbr`, both of which work on x86_64-darwin).

          ### Installation

          **macOS (easiest):** download `mbr-macos-arm64.dmg`, open it, and drag
          `MBR.app` to the Applications folder.

          These builds are ad-hoc signed but **not notarized**, so the first launch is
          blocked by Gatekeeper. Right-click `MBR.app` → **Open** → **Open**, or run:

          ```bash
          xattr -dr com.apple.quarantine /Applications/MBR.app
          ```

          **macOS (tarball):**
          ```bash
          tar xzf mbr-macos-arm64.tar.gz
          cp -r MBR.app /Applications/
          ```

          **Linux:** pick the tarball matching `uname -m` — `x86_64` or `aarch64`.
          ```bash
          tar xzf mbr-linux-x86_64.tar.gz   # or mbr-linux-arm64.tar.gz
          sudo mv mbr /usr/local/bin/
          ```

          **Windows:**
          Unzip `mbr-windows-x86_64.zip` (or `mbr-windows-aarch64.zip` on ARM64)
          and run `mbr.exe`. Requires the Microsoft
          Edge WebView2 runtime for GUI mode (preinstalled on Windows 11 and current
          Windows 10). Windows builds do not include video metadata/transcoding or
          PDF cover extraction.

          ### Verification

          Verify downloads using the SHA256SUMS file:
          ```bash
          sha256sum -c SHA256SUMS
          ```
          EOF

          # Where `generate_release_notes: true` used to splice its output in.
          cat generated_notes.md >> release_notes.md

      # No `generate_release_notes` — the step above already appended notes
      # generated against an explicit base tag. Turning it back on would make
      # GitHub append a *second* What's Changed section over its own inferred
      # range.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.validate-version.outputs.version }}
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.validate-version.outputs.version) }}
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(needs.validate-version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io after the GitHub Release succeeds.
  # --allow-dirty: templates/components-js/ is gitignored but must be present
  #   in the tree so include_bytes! picks up the built component.
  # --no-verify: the `test` and `build` jobs above have already compiled the
  #   crate with the shipped feature set; skipping the verify recompile avoids
  #   needing ffmpeg/pdfium system libs here.
  # `build-components` is listed explicitly for the same reason as build-windows
  # above: this job downloads the components artifact, and it used to inherit the
  # ordering transitively via `test`, which no longer depends on build-components.
  publish-crate:
    name: Publish to crates.io
    needs: [validate-version, test, release, build-components]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download components
        uses: actions/download-artifact@v8
        with:
          name: components
          path: templates/components-js/

      - name: Publish to crates.io
        run: cargo publish --allow-dirty --no-verify --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
