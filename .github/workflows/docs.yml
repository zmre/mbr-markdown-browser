name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-progress runs for the same ref
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Pull-only, like every cachix block in ci.yml (see the note on its first
          # one). What this job builds starts from deps layers ci.yml pushes.
          pushFilter: '-(source|vendor)$'
          skipPush: true

      - name: Build mbr
        run: nix build -L .#mbr

      - name: Build documentation site
        env:
          # The site is a GitHub project page, served under /mbr-markdown-browser/.
          # 404.html is served at whatever URL was missing, so it anchors its
          # assets, site.json and Home link at base_url; left at the default "/"
          # it loads nothing (no styles, no "did you mean" suggestions).
          MBR_BASE_URL: /mbr-markdown-browser/
        run: |
          ./result/bin/mbr -b --oembed-timeout-ms 1000 --output ./docs-build ./docs
          echo "Documentation built successfully"
          ls -la ./docs-build

      - name: Create Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory ./docs-build \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
