# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nix" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
  - package-ecosystem: "rust-toolchain" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
  - package-ecosystem: "bun" # See documentation for possible values
    directory: "/components" # Location of package manifests
    schedule:
      interval: "monthly"
  - package-ecosystem: "swift" # See documentation for possible values
    directory: "/quicklook" # Location of package manifests
    schedule:
      interval: "monthly"
  # For github-actions the directory must be "/" — Dependabot then scans
  # /.github/workflows plus any root action.yml. Pointing it at the workflows
  # directory itself finds nothing, which is why every action here drifted on a
  # mutable tag. The actions are now SHA-pinned with a version comment, which is
  # the form Dependabot updates in place.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
