[package]
name = "mbr-markdown-browser"
version = "0.6.2"
edition = "2024"
rust-version = "1.92"
authors = ["Patrick Walsh <pwalsh@well.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
description = "A fast, featureful markdown viewer, browser, and (optional) static site generator"
homepage = "https://github.com/zmre/mbr-markdown-browser/"
repository = "https://github.com/zmre/mbr-markdown-browser/"
documentation = "https://zmre.github.io/mbr-markdown-browser/"
keywords = ["markdown", "gui", "cli", "productivity", "static"]
categories = ["command-line-utilities", "gui", "template-engine"]
build = "build.rs"
autobenches = false

include = [
    "src/**/*",
    "build.rs",
    "templates/**/*",
    "mbr-icon.png",
    "/LICENSE",
    "/README.md",
]

[lib]
crate-type = ["lib", "staticlib"]
name = "mbr"
bench = false

[features]
# The full desktop app. Every subsystem is listed even where another feature
# already implies it, so this line alone says what `mbr` ships.
#
# Without default features the library is the render core only (markdown,
# templates, config, repo scan, search, indexes, assets): what the QuickLook
# staticlib links (`--no-default-features --features ffi`) and what a mobile
# shell builds on. Windows ships everything except `media-metadata`; that
# exact list is `minimalFeatures` in flake.nix, and ci.yml/release.yml repeat
# it, so change all three together.
default = ["gui", "media-metadata", "server", "watcher", "ssg", "cli"]
# GUI feature enables native window/browser functionality (wry, tao, muda, rfd)
# plus the per-platform system-URL-handler crates `external_open` uses to send
# off-site links to the user's browser/mail client instead of the mbr window.
# The window is a client of the in-process HTTP server, hence `server`.
gui = [
    "server",
    "dep:wry",
    "dep:tao",
    "dep:muda",
    "dep:rfd",
    "dep:image",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:windows-sys",
    "dep:gio",
    "dep:gtk",
]
# Media metadata extraction (requires ffmpeg, pdfium) - disable for QuickLook to avoid SDL dependency
media-metadata = ["dep:metadata", "dep:ffmpeg-next", "dep:pdfium-render", "dep:tempfile", "dep:image"]
# Static ffmpeg linking for (remove runtime ffmpeg dependency)
ffmpeg-static = ["ffmpeg-next/static", "metadata/static"]
# The axum HTTP server (`server.rs`): routes, live-reload WebSocket, edit
# endpoints. Works without `watcher` — the change channel still carries the
# server's own writes, there are just no events from disk.
server = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:futures-util",
    "dep:tracing-subscriber",
]
# Filesystem watcher (`watcher.rs`, notify) feeding live reload and index
# invalidation. Only useful with `server`, but compiles on its own.
watcher = ["dep:notify"]
# Static site generator (`build.rs`) plus its pagefind search index.
ssg = ["dep:pagefind"]
# The `mbr` command-line binary (`cli.rs`, `main.rs`). Its modes are the
# server and the static build, so it implies both.
cli = ["server", "ssg", "dep:clap", "dep:rpassword", "dep:tracing-subscriber"]
# UniFFI exports for the Apple Swift shells (QuickLook staticlib).
ffi = ["dep:uniffi"]

[dependencies]
# winit = "0.30.11"
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio", "tracing", "ws"], optional = true }
# `serde` is needed so `tasks::Task`'s NaiveDateTime fields cross the HTTP boundary.
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
clap = { version = "4.5", features = ["derive"], optional = true }
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3.32"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }
glob = "0.3.3"
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"], optional = true }
html-escape = "0.2.13"
itertools = "0.15.0"
lru = "0.18"
metadata = { version = "0.1.10", optional = true } # Requires ffmpeg for video/audio metadata extraction
ffmpeg-next = { version = "7.1", optional = true }  # Direct dep to control log level (suppress warnings from metadata crate)
pdfium-render = { version = "0.9", optional = true, default-features = false, features = ["image_025", "pdfium_7543"] } # PDF cover; pdfium_7543 is the newest API level not above nixpkgs-26.05 pdfium-binaries 7749
tempfile = { version = "3.27", optional = true } # Collision-free temp files for HLS segment transcoding (media-metadata)
papaya = "0.2.4"
pathdiff = "0.2.3"
lopdf = { version = "0.45", default-features = false, features = ["rayon"] }
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
pulldown-cmark-escape = { version = "0.11", default-features = false }
rayon = "1.11"
regex = "1.13"
# "rustls-no-provider" (not "rustls"): the plain feature force-enables the
# aws-lc-rs crypto provider, which needs NASM + a C toolchain on
# x86_64-pc-windows-msvc and is not displaced by selecting ring elsewhere
# (cargo features are additive). We supply our own provider via
# `lib::http_client_builder()` -> `use_preconfigured_tls`, so reqwest must not
# pick one for us.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tera = { version = "1.20", features = ["preserve_order", "date-locale"] }
time = "0.3"
tokio = {version="1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"]}
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.7", features = ["fs", "trace", "set-header", "compression-gzip"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
url = "2.5"
walkdir = "2.5"
thiserror = "2.0"
parking_lot = "0.12"
# Editing feature: password/token hashing for the edit endpoint
argon2 = "0.6"
# Random bytes for `--generate-edit-token`. Already in the tree at 0.4 via
# argon2's password-hash, so naming it adds no crate.
getrandom = "0.4"
sha2 = "0.11"
rpassword = { version = "7", optional = true }
# default-features = false drops the "encoding" feature (YamlDecoder), which we never
# use: 0.13 pins encoding_rs below 0.8.40 and would add a second, older copy.
yaml-rust2 = { version = "0.13", default-features = false }
# GUI dependencies (optional, enabled by default "gui" feature)
wry = { version = "0.57", default-features = true, features = ["devtools"], optional = true }

# Search functionality
nucleo-matcher = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
# default-features = false drops the "serve" feature (actix-web + actix-files +
# portpicker), which we never use and which drags in the C-built zstd-sys.
# Never enable "extended": its lindera-unidic dependency downloads a dictionary
# from S3 in a build script, which breaks sandboxed/nix builds.
pagefind = { version = "1.5", default-features = false, optional = true }
aho-corasick = "1.1"

# Image processing with minimal features (only needed formats)
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
# GUI dependencies (optional, enabled by default "gui" feature)
tao = { version = "0.37.0", optional = true }
muda = { version = "0.21", optional = true }
# Do NOT add the `common-controls-v6` feature: it wires the Windows/Linux
# folder-or-file prompt (`open_picker.rs`) to `TaskDialogIndirect`, which is
# exported only by the manifest-activated v6 `comctl32.dll` — a Rust binary
# embeds no such manifest, so the statically linked import resolves against
# the wrong `comctl32.dll` and Windows refuses to start the process at all
# (`STATUS_ENTRYPOINT_NOT_FOUND`), for every invocation, not just the ones
# that show the dialog. See `open_picker.rs`'s module doc comment.
rfd = { version = "0.17", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
muda = { version = "0.21", features = ["gtk3"], optional = true }
# `external_open`: gio's AppInfo::launch_default_for_uri is the desktop-portal
# aware equivalent of xdg-open without the process spawn. Pinned to the gio the
# GTK stack (gtk/webkit2gtk under tao/wry/muda) already uses, so this adds no
# crate; a newer gio would link a second glib. Move it only with that stack.
gio = { version = "0.18", optional = true }
# `browser`: the menu bar is a `GtkMenuBar` inside the window on Linux, so
# hiding it (and making the hide survive a later `show_all()`) needs `WidgetExt`.
# Same situation as gio above — gtk 0.18.2 is already in the tree via
# tao/muda/webkit2gtk at this exact version, so naming it adds no crate.
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# `external_open`: ShellExecuteW. windows-sys 0.61.2 is already in the tree many
# times over; only the feature gates below are new, and those add no crate.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `external_open`: NSWorkspace::openURL, the only way a WKWebView-hosted app can
# reach the user's default handler (unlike UIKit, WKWebView never falls back to
# it on its own). Both crates are already in the tree at exactly these versions
# via tao/wry; promoting them to direct dependencies and adding the NSWorkspace
# feature gate adds no crate to the graph. Safe wrappers, so no `unsafe` here.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSWorkspace",
], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSString",
    "NSURL",
], optional = true }

# UniFFI is only used by the Apple Swift shells (ffi feature): the macOS
# QuickLook extension and the iOS app. Target-gate it to Apple platforms so
# Linux/Windows builds never compile the Swift bindings generator, even
# transitively as a build-dependency. `target_vendor`, not `target_os`, so the
# iOS staticlib (aarch64-apple-ios[-sim]) gets it too.
[target.'cfg(target_vendor = "apple")'.dependencies]
# Pinned to 0.31: uniffi_bindgen 0.32 pulls askama 0.16, which reads askama.toml
# via a CARGO_MANIFEST_DIR-relative path that breaks under crane's split vendoring
# (macOS mbr-quicklook-staticlib build fails). Revisit when crane/askama interop is fixed.
uniffi = { version = "0.31", features = ["cli", "bindgen"], optional = true }

# Non-optional (like a plain build-dependency) but Apple-only: build.rs needs
# it whenever the ffi feature is on, and a feature can't reliably activate a
# build-dependency via `dep:`. Absent entirely on Linux/Windows. Cargo selects
# build-dependencies by the *target* platform's cfg, so this is what lets
# build.rs find uniffi under `--target aarch64-apple-ios[-sim]`.
[target.'cfg(target_vendor = "apple")'.build-dependencies]
uniffi = { version = "0.31", features = ["build"] }

[dev-dependencies]
# `test_support` captures log output in unit tests under every feature set,
# including ones where `server`/`cli` (which bring it in) are off.
tracing-subscriber = "0.3"
criterion = { version = "0.8", features = ["async_tokio"] }
filetime = "0.2"
flate2 = "1.0"
proptest = "1.11"
tempfile = "3.27"

[[bin]]
name = "mbr"
path = "src/main.rs"
required-features = ["cli"]
bench = false

# Integration tests that drive a subsystem the lib only has with its feature.
# Declared explicitly (autotests still discovers the rest) so a
# `--no-default-features` test run skips them instead of failing to compile.
[[test]]
name = "server_integration"
required-features = ["server"]

[[test]]
name = "build_integration"
required-features = ["ssg"]

# Runs the real `mbr` binary (`CARGO_BIN_EXE_mbr`), which only exists with `cli`.
[[test]]
name = "cli_integration"
required-features = ["cli"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["ffi"]
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 16
panic = 'abort'
strip = 'debuginfo'

[[bench]]
name = "markdown_render"
harness = false

[[bench]]
name = "html_output"
harness = false

[[bench]]
name = "path_resolver"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "repo_scan"
harness = false

[[bench]]
name = "template_render"
harness = false

[[bench]]
name = "sorting"
harness = false

[[bench]]
name = "link_processing"
harness = false

[[bench]]
name = "cache_operations"
harness = false

[[bench]]
name = "tasks"
harness = false
