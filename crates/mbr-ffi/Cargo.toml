[package]
name = "mbr-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "UniFFI surface of mbr, the markdown browser, for its Apple shells (QuickLook, and the iOS app with the mobile feature). Internal crate of mbr-markdown-browser, versioned in lockstep with it; no API stability guarantees"
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "../../README.md"
build = "build.rs"

# UniFFI is only used by the Apple Swift shells: the macOS QuickLook extension
# and the iOS app. Target-gate it to Apple platforms so Linux/Windows builds
# never compile it, even transitively as a build-dependency. `target_vendor`,
# not `target_os`, so the iOS staticlib (aarch64-apple-ios[-sim]) gets it too.
# Runtime support only: the `cli` feature (bindings generator, clap) belongs to
# the `uniffi-bindgen` binary in the `mbr` crate.
[target.'cfg(target_vendor = "apple")'.dependencies]
uniffi.workspace = true

[lib]
# `staticlib` is `libmbr_ffi.a`, what the QuickLook extension links
# (`-lmbr_ffi`); `lib` lets the `mbr` crate re-export it under `ffi`.
crate-type = ["lib", "staticlib"]
name = "mbr_ffi"
bench = false

[features]
# The iOS app's surface (`mobile`): the in-process HTTP server behind the
# `mbr://` scheme handler, the coordinated vault, the persistent index and the
# fail-fast I/O policy. Pulls in mbr-server without its `watcher` (iOS has no
# change events worth the descriptors) or `media-metadata` (no ffmpeg/pdfium on
# iOS). Off by default, so the QuickLook staticlib links none of it.
mobile = [
    "dep:mbr-server",
    "dep:axum",
    "dep:futures",
    "dep:rayon",
    "dep:sha2",
    "dep:tower",
    "dep:tracing",
]

[dependencies]
mbr-core.workspace = true

html-escape.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde_json.workspace = true
tera.workspace = true
thiserror.workspace = true
tokio.workspace = true

# mobile
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
mbr-server = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# Apple-only, like the runtime dependency above. Cargo selects
# build-dependencies by the *target* platform's cfg, so this is what lets
# build.rs find uniffi under `--target aarch64-apple-ios[-sim]`.
[target.'cfg(target_vendor = "apple")'.build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true
