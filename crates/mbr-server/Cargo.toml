[package]
name = "mbr-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP server for mbr, the markdown browser: routes, live reload, edit endpoints and the file watcher"
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
readme = "../../README.md"

[lib]
name = "mbr_server"
bench = false

[features]
# Filesystem watcher (`watcher.rs`, notify) feeding live reload and index
# invalidation. A feature rather than its own crate: the server is its only
# consumer, and it is two hundred lines over `mbr-core` and notify.
watcher = ["dep:notify"]
# The media routes (video metadata, HLS transcode/remux, PDF covers), which
# call into mbr-core's media-metadata modules.
media-metadata = ["mbr-core/media-metadata"]

[dependencies]
mbr-core.workspace = true

aho-corasick.workspace = true
axum.workspace = true
chrono.workspace = true
futures.workspace = true
futures-util.workspace = true
itertools.workspace = true
papaya.workspace = true
parking_lot.workspace = true
pathdiff.workspace = true
percent-encoding.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true

notify = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
